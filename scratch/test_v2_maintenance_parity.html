<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CCTV OPS V2 - Maintenance Workspace Parity Test Suite</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 24px;
      margin: 0;
    }
    .test-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .test-pass { color: #4ade80; }
    .test-fail { color: #f87171; }
    .summary-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 9999px;
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 16px;
    }
    .summary-pass { background: rgba(74, 222, 128, 0.2); color: #4ade80; border: 1px solid #4ade80; }
    .summary-fail { background: rgba(248, 113, 113, 0.2); color: #f87171; border: 1px solid #f87171; }
    #log { font-family: monospace; font-size: 12px; line-height: 1.6; }
  </style>
</head>
<body>
  <h2>CCTV OPS V2 - Maintenance Workspace 100% Parity Test Suite</h2>
  <div id="summary" class="summary-badge">Running tests...</div>
  <div class="test-card">
    <div id="log"></div>
  </div>

  <!-- Load dependencies -->
  <script src="../auth-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="../cctv-ops-v2/js/config.js"></script>
  <script src="../cctv-ops-v2/js/storage.js"></script>
  <script src="../cctv-ops-v2/js/shared.js"></script>
  <script src="../cctv-ops-v2/js/services/auth-service.js"></script>
  <script src="../cctv-ops-v2/js/services/edr-service.js"></script>
  <script src="../cctv-ops-v2/js/services/audit-service.js"></script>
  <script src="../cctv-ops-v2/js/services/sorter-service.js"></script>
  <script src="../cctv-ops-v2/js/services/maintenance-service.js"></script>

  <script>
    const m = window.maintenanceService;
    let passed = 0;
    let failed = 0;
    let failedList = [];
    const logEl = document.getElementById("log");

    function assert(desc, condition) {
      const line = document.createElement("div");
      if (condition) {
        passed++;
        line.className = "test-pass";
        line.textContent = `[PASS] ${desc}`;
      } else {
        failed++;
        failedList.push(desc);
        line.className = "test-fail";
        line.textContent = `[FAIL] ${desc}`;
      }
      logEl.appendChild(line);
    }

    async function runTests() {
      try {
        // 1. Destination Configuration Checks
      const destKeys = Object.keys(m.MAINTENANCE_DESTINATIONS);
      assert("Maintenance defines all 8 official destinations", destKeys.length === 8);
      assert("Destination mabini_a exists with correct sheet ID", m.MAINTENANCE_DESTINATIONS.mabini_a?.sheetId === 484781158);
      assert("Destination mabini_b exists with correct sheet ID", m.MAINTENANCE_DESTINATIONS.mabini_b?.sheetId === 1670996421);
      assert("Destination gensan exists with correct sheet ID", m.MAINTENANCE_DESTINATIONS.gensan?.sheetId === 219168917);
      assert("Destination maa_4_5 exists with sheetId 0", m.MAINTENANCE_DESTINATIONS.maa_4_5?.sheetId === 0);
      assert("Destination maa_6 exists with correct sheet ID", m.MAINTENANCE_DESTINATIONS.maa_6?.sheetId === 11380648);
      assert("Destination digos exists with correct sheet ID", m.MAINTENANCE_DESTINATIONS.digos?.sheetId === 1812673001);
      assert("Destination ecoland exists with correct sheet ID", m.MAINTENANCE_DESTINATIONS.ecoland?.sheetId === 429979469);
      assert("Destination cdo exists with correct sheet ID", m.MAINTENANCE_DESTINATIONS.cdo?.sheetId === 1535793826);

      // 2. Apps Script URL validation & local setup storage
      assert("Valid Apps Script URL ending in /exec is accepted", m.isValidAppsScriptWebAppUrl("https://script.google.com/macros/s/AKfycbxyz123/exec"));
      assert("URL ending in /dev is rejected", !m.isValidAppsScriptWebAppUrl("https://script.google.com/macros/s/AKfycbxyz123/dev"));
      assert("Arbitrary non-Apps Script URL is rejected", !m.isValidAppsScriptWebAppUrl("https://example.com/api"));

      const testUrl = "https://script.google.com/macros/s/AKfycbtestMaintenance/exec";
      m.saveMaintenanceSheetSetup(testUrl);
      assert("saveMaintenanceSheetSetup stores URL in localStorage", m.getMaintenanceSheetsWebAppUrl() === testUrl);
      m.clearMaintenanceSheetSetup();
      assert("clearMaintenanceSheetSetup removes URL from localStorage", m.getMaintenanceSheetsWebAppUrl() === "");

      // 3. Destination Auto-Detection from TSV lines
      const sampleGensan = "09/10/2026 14:00\t2026-09-10\tJuan Dela Cruz\tShopee\tGensan Site\tST-101\tMonitor flickering";
      const sampleMaa6 = "09/10/2026 14:00\t2026-09-10\tMaria Santos\tAFP\tMAA 6th Floor\tST-202\tNo display";
      const sampleDigos = "09/10/2026 14:00\t2026-09-10\tPedro Penduko\tTEMU\tDigos Site\tST-303\tMouse not detected";
      const sampleMabiniB = "09/10/2026 14:00\t2026-09-10\tSarah Connor\tOptum\tMabini Site B - 2nd Floor\tST-404\tLoose power cable";

      assert("detectMaintenanceDestinationFromRows detects gensan", m.detectMaintenanceDestinationFromRows(sampleGensan) === "gensan");
      assert("detectMaintenanceDestinationFromRows detects maa_6", m.detectMaintenanceDestinationFromRows(sampleMaa6) === "maa_6");
      assert("detectMaintenanceDestinationFromRows detects digos", m.detectMaintenanceDestinationFromRows(sampleDigos) === "digos");
      assert("detectMaintenanceDestinationFromRows detects mabini_b", m.detectMaintenanceDestinationFromRows(sampleMabiniB) === "mabini_b");

      // 4. Block Generation
      const block = m.makeBlock();
      assert("makeBlock generates unique string id starting with b_", typeof block.id === "string" && block.id.startsWith("b_"));
      assert("makeBlock initializes lanesText as empty string", block.lanesText === "");
      assert("makeBlock initializes remarks as array with empty string", Array.isArray(block.remarks) && block.remarks.length === 1);
      assert("makeBlock initializes empty screenshots array", Array.isArray(block.screenshots) && block.screenshots.length === 0);
      assert("makeBlock initializes dataHidden as false", block.dataHidden === false);

      // 5. Image Compression & Screenshot helper
      const samplePixel = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsMAAA7DAcdvqGQAAAAYdEVYdFNvZnR3YXJlAHBhaW50Lm5ldCA0LjAuNWWFMmUAAAAYSURBVBhXY/jPwPD/PwMDAwMDAwMDAwMDAwMB8wL/Yd2W0QAAAABJRU5ErkJggg==";
      const compressed = await m.compressBase64(samplePixel);
      assert("compressBase64 returns valid data URL", typeof compressed === "string" && compressed.startsWith("data:image/jpeg;base64,"));
      assert("maintenanceScreenshotSource extracts dataUrl from string", m.maintenanceScreenshotSource(samplePixel) === samplePixel);
      assert("maintenanceScreenshotSource extracts dataUrl from object", m.maintenanceScreenshotSource({ dataUrl: samplePixel }) === samplePixel);

      // 6. IndexedDB Draft Autosave & Named Drafts Parity
      const draftState = {
        date: "2026-09-10",
        destinationKey: "gensan",
        title: "Gensan Site",
        blocks: [
          {
            id: m.uid(),
            lanesText: sampleGensan,
            remarks: ["Cable replaced by IT on shift"],
            screenshots: [samplePixel],
            dataHidden: false
          }
        ]
      };

      await m.saveDraft(draftState);
      const loadedDraft = await m.loadDraft();
      assert("loadDraft retrieves saved draft from IndexedDB", loadedDraft !== null);
      assert("loadedDraft preserves destinationKey", loadedDraft.destinationKey === "gensan");
      assert("loadedDraft preserves blocks length", loadedDraft.blocks?.length === 1);
      assert("loadedDraft preserves block remarks", loadedDraft.blocks[0]?.remarks[0] === "Cable replaced by IT on shift");
      assert("loadedDraft preserves screenshot data", loadedDraft.blocks[0]?.screenshots?.length === 1);

      // Named drafts
      const namedRecord = await m.saveNamedDraft("Snapshot Gensan Sept 10", draftState);
      const namedId = namedRecord?.id;
      assert("saveNamedDraft stores snapshot and returns id", typeof namedId === "string" && namedId.length > 0);

      const namedList = await m.getNamedDrafts();
      assert("getNamedDrafts lists saved snapshots", Array.isArray(namedList) && namedList.some(d => d.id === namedId));

      const loadedNamed = await m.loadNamedDraft(namedId);
      assert("loadNamedDraft loads snapshot data intact", loadedNamed?.data?.destinationKey === "gensan");

      await m.deleteNamedDraft(namedId);
      const afterDeleteList = await m.getNamedDrafts();
      assert("deleteNamedDraft removes snapshot from store", !afterDeleteList.some(d => d.id === namedId));

      // 7. Payload building for Google Sheets
      const payload = m.buildMaintenanceSheetsPayload(draftState);
      assert("buildMaintenanceSheetsPayload generates action appendMaintenanceReport", payload.action === "appendMaintenanceReport");
      assert("buildMaintenanceSheetsPayload targets sheetId 219168917", payload.sheetId === 219168917);
      assert("buildMaintenanceSheetsPayload includes report date", payload.date === "2026-09-10");
      assert("buildMaintenanceSheetsPayload includes data rows", payload.rows?.length === 1);
      assert("buildMaintenanceSheetsPayload includes screenshots", payload.screenshots?.length === 1);
      assert("buildMaintenanceSheetsPayload includes remarks list", payload.remarks?.length === 1 && payload.remarks[0] === "Cable replaced by IT on shift");

      // Test dataHidden exclusion rule
      const hiddenState = {
        date: "2026-09-10",
        destinationKey: "gensan",
        title: "Gensan Site",
        blocks: [
          {
            id: m.uid(),
            lanesText: sampleGensan,
            remarks: ["Issue handled internally"],
            screenshots: [],
            dataHidden: true
          }
        ]
      };
      const hiddenPayload = m.buildMaintenanceSheetsPayload(hiddenState);
      assert("Excluded (dataHidden=true) block rows are not sent in payload rows", hiddenPayload.rows.length === 0);
      assert("Excluded block remarks are still preserved in remarks list", hiddenPayload.remarks.length === 1);

      // 8. Rich HTML with Arial 10pt and in-table screenshots
      const reportHtml = m.maintenanceReportHtmlForSheets(draftState);
      assert("Report HTML contains Arial,sans-serif font family", reportHtml.includes("font-family:Arial,sans-serif"));
      assert("Report HTML contains 10px font size", reportHtml.includes("font-size:10px"));
      assert("Report HTML embeds screenshot image tag with 220px width", reportHtml.includes('width:220px') && reportHtml.includes('<img'));
      assert("Report HTML includes green remarks box #278914", reportHtml.includes("#278914"));

      // 9. Plain text fallback
      const reportPlain = m.maintenanceReportPlainTextForSheets(draftState);
      assert("Report Plain text includes title header", reportPlain.includes("Gensan Site") && reportPlain.includes("2026-09-10"));
      assert("Report Plain text includes station issue row", reportPlain.includes("Monitor flickering"));
      assert("Report Plain text includes remarks", reportPlain.includes("Cable replaced by IT on shift"));

      // Update Summary
      const summaryEl = document.getElementById("summary");
      summaryEl.textContent = `${passed} PASSED / ${failed} FAILED`;
      summaryEl.className = `summary-badge ${failed === 0 ? "summary-pass" : "summary-fail"}`;

      // Send test report back to local server
      fetch("http://localhost:8080/api/test_report", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          summary: `MAINTENANCE_PARITY: ${passed} PASSED, ${failed} FAILED`,
          passed,
          failed,
          failedList
        })
      });
      } catch (err) {
        console.error("Test error:", err);
        const errDiv = document.createElement("div");
        errDiv.className = "test-fail";
        errDiv.textContent = `[EXCEPTION] ${err.message} \n ${err.stack}`;
        logEl.appendChild(errDiv);
        failed++;
        fetch("http://localhost:8080/api/test_report", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ summary: `MAINTENANCE_ERROR: ${err.message}`, error: err.message, stack: err.stack })
        });
      }
    }

    window.addEventListener("DOMContentLoaded", runTests);
  </script>
</body>
</html>
