<!DOCTYPE html>
<html><head>
  <meta charset="utf-8">
  <title>EDR Behavior Automated Tests</title>
</head>
<body>
  <h1>Running EDR Tests...</h1>
  <div id="results">Running tests...</div>

  <iframe id="testFrame" src="http://localhost:8080/cctv-ops-v2/index.html" style="width:1200px; height:800px; border:1px solid #ccc;"></iframe>

  <script>
    const results = [];
    function assert(name, condition, detail = "") {
      results.push({ name, passed: !!condition, detail });
      console.log((condition ? "PASS: " : "FAIL: ") + name + (detail ? " - " + detail : ""));
    }

    window.onerror = (msg, url, line) => {
      assert("Global window error: " + msg, false, line);
    };

    const frame = document.getElementById("testFrame");
    frame.onload = async () => {
      const win = frame.contentWindow;
      const doc = frame.contentDocument;
      const edr = win.CCTV_EDR;
      const cfg = win.CCTV_V2_CONFIG;

      // Wait a tick for DOMContentLoaded and init
      await new Promise(r => setTimeout(r, 800));

      try {
        // TEST 1: TL / OM Data Sources
        const tls = win.getTeamLeaderNames();
        const oms = win.getOmNames();
        assert("TL list has at least 366 names", tls.length >= 366, `Count: ${tls.length}`);
        assert("OM list has at least 27 names", oms.length >= 27, `Count: ${oms.length}`);
        assert("OM list has 'Abby'", oms.includes("Abby"));
        assert("OM list has 'Willy'", oms.includes("Willy"));
        assert("TL list has 'Abegail Llena'", tls.includes("Abegail Llena"));
        assert("TL list has 'Zyrie Christian Wasil'", tls.includes("Zyrie Christian Wasil"));

        // TEST 2: Respondent = TL Dropdown
        const btnTl = doc.getElementById("btnRoleTl");
        const btnOm = doc.getElementById("btnRoleOm");
        const respInput = doc.getElementById("edrSupervisorName");
        const respList = doc.getElementById("listRespondents");

        btnTl.click();
        await new Promise(r => setTimeout(r, 100));

        const tlOptions = Array.from(respList.querySelectorAll("option")).map(o => o.value);
        assert("When TL selected, options match TL list", tlOptions.length >= 366);
        assert("When TL selected, does NOT contain pure OM 'Abby'", !tlOptions.includes("Abby"));
        assert("When TL selected, placeholder is 'Search Team Leader...'", respInput.placeholder === "Search Team Leader...");

        // TEST 3: Respondent = OM Dropdown
        btnOm.click();
        await new Promise(r => setTimeout(r, 100));

        const omOptions = Array.from(respList.querySelectorAll("option")).map(o => o.value);
        assert("When OM selected, options match OM list", omOptions.length === oms.length, `Count: ${omOptions.length}`);
        assert("When OM selected, contains 'Abby'", omOptions.includes("Abby"));
        assert("When OM selected, does NOT contain pure TL 'Abegail Llena'", !omOptions.includes("Abegail Llena"));
        assert("When OM selected, placeholder is 'Search OM...'", respInput.placeholder === "Search OM...");

        // TEST 4: Dropdown switching clears invalid selection
        // In OM mode, set input to "Crystal" (valid OM)
        respInput.value = "Crystal";
        // Switch to TL mode -> "Crystal" is NOT a valid TL name, so it must be cleared!
        btnTl.click();
        await new Promise(r => setTimeout(r, 100));
        assert("Switching OM -> TL clears invalid TL name", respInput.value === "", `Value was: "${respInput.value}"`);

        // In TL mode, set input to "Abegail Llena" (valid TL)
        respInput.value = "Abegail Llena";
        // Switch to OM mode -> "Abegail Llena" is NOT a valid OM name, so it must be cleared!
        btnOm.click();
        await new Promise(r => setTimeout(r, 100));
        assert("Switching TL -> OM clears invalid OM name", respInput.value === "", `Value was: "${respInput.value}"`);

        // Switch back to TL
        btnTl.click();

        // TEST 5: Dedicated OM Field & Violation Subject Separation
        const dedicatedOmInput = doc.getElementById("edrOmName");
        const dedicatedOmList = doc.getElementById("listOms");
        const dedicatedOmOptions = Array.from(dedicatedOmList.querySelectorAll("option")).map(o => o.value);
        assert("Dedicated OM list contains OM names only", dedicatedOmOptions.length === oms.length);

        const btnSubjAgent = doc.getElementById("btnSubjAgent");
        const btnSubjTl = doc.getElementById("btnSubjTl");
        const subjInput = doc.getElementById("edrSubjectName");

        btnSubjAgent.click();
        assert("Violation Subject = Agent/s does not change Respondent role", btnTl.classList.contains("active"));
        assert("Violation Subject = Agent/s placeholder is 'Employee name...'", subjInput.placeholder === "Employee name...");

        btnSubjTl.click();
        assert("Violation Subject = TL does not change Respondent role", btnTl.classList.contains("active"));
        assert("Violation Subject = TL placeholder is 'Search Team Leader...'", subjInput.placeholder === "Search Team Leader...");
        const subjTlOptions = Array.from(doc.getElementById("listSubjectTls").querySelectorAll("option")).map(o => o.value);
        assert("Violation Subject = TL datalist has TL names", subjTlOptions.length >= 366);

        // TEST 6: CCTV Clip Hyperlink Generation
        const sampleReport = {
          id: "test_edr_1",
          site: "Mabini Site A",
          date: "2026-09-10",
          timeObserved: "03:15:00 AM-03:22:00 AM",
          supervisorRole: "Team Leader",
          supervisorName: "Abegail Llena",
          subjectType: "Agent/s",
          subjectName: "John Doe",
          account: "Shopee",
          incident: "Sleeping on workstation",
          action: "Issued verbal warning",
          clipLink: "https://drive.google.com/file/d/12345sample/view",
          screenshotData: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==",
          selected: true,
          done: false
        };

        await edr.createOrUpdate(sampleReport);
        await edr.loadReports();

        // Check HTML format
        const html = edr.buildTeamsHtml();
        assert("HTML contains exact clickable link with 'Click here!'", html.includes('<a href="https://drive.google.com/file/d/12345sample/view">Click here!</a>'));
        assert("HTML does NOT show raw URL beside 'Click here!'", !html.includes('Click here! (http'));
        assert("HTML does NOT contain data:image or Base64", !html.includes("data:image") && !html.includes(";base64,"));
        assert("HTML does NOT contain full webpage DOM", !html.includes("<html") && !html.includes("<body") && !html.includes("nav-rail"));
        assert("HTML uses clean Arial 10pt container", html.includes("font-family:Arial,sans-serif;font-size:10pt;"));

        // Check Plain Text format
        const plain = edr.buildTeamsOutput();
        assert("Plain text fallback format is 'CCTV Clip: ACTUAL_URL'", plain.includes("CCTV Clip: https://drive.google.com/file/d/12345sample/view"));
        assert("Plain text does NOT have 'Click here! (http...)'", !plain.includes("Click here! (http"));

        // TEST 7: Native PNG Image Blob Conversion
        const pngBlob = await edr.dataUrlToBlob(sampleReport.screenshotData);
        assert("dataUrlToBlob produces native Blob", pngBlob instanceof win.Blob || (pngBlob && pngBlob.type === "image/png"));
        assert("Blob type is image/png", pngBlob.type === "image/png");
        assert("Blob size is > 0", pngBlob.size > 0);

        // TEST 8: Teams Message Size Protection (< 2KB with 1 EDR + 10 FB links)
        const fbLinks = [
          "https://www.facebook.com/groups/123/posts/1001",
          "https://www.facebook.com/groups/123/posts/1002",
          "https://www.facebook.com/groups/123/posts/1003",
          "https://www.facebook.com/groups/123/posts/1004",
          "https://www.facebook.com/groups/123/posts/1005",
          "https://www.facebook.com/groups/123/posts/1006",
          "https://www.facebook.com/groups/123/posts/1007",
          "https://www.facebook.com/groups/123/posts/1008",
          "https://www.facebook.com/groups/123/posts/1009",
          "https://www.facebook.com/groups/123/posts/1010"
        ].join("\n");

        const largeHtml = edr.buildTeamsHtml(fbLinks);
        const htmlByteSize = new TextEncoder().encode(largeHtml).length;
        assert("1 EDR + 10 FB links HTML payload is small (< 3 KB)", htmlByteSize < 3000, `Actual size: ${htmlByteSize} bytes`);
        assert("Large HTML payload contains no Base64", !largeHtml.includes("base64"));

        // TEST 9: Screenshot Persistence in EDR
        const reportsAfterReload = await edr.loadReports();
        const reloaded = reportsAfterReload.find(r => r.id === sampleReport.id);
        assert("Saved EDR preserves screenshotData", reloaded && reloaded.screenshotData === sampleReport.screenshotData);

        // TEST 10: Copy Screenshot Button in UI & Saved Card Parity
        const btnCopyShot = doc.getElementById("btnCopyScreenshot");
        assert("btnCopyScreenshot exists in Teams Dispatch header", !!btnCopyShot);

        const cardRow = doc.querySelector(`.record-row[data-id="${sampleReport.id}"]`);
        assert("Saved record card exists in DOM", !!cardRow);

        // TEST 11: Compact List - NO Screenshot Thumbnails in Main List (per user instruction)
        const thumbWrap = cardRow ? cardRow.querySelector('.record-thumb-wrap') : null;
        assert("Saved record card does NOT display thumbnail element (.record-thumb-wrap)", !thumbWrap);
        const thumbImg = cardRow ? cardRow.querySelector('img.record-thumb') : null;
        assert("Saved record does NOT contain <img> thumbnail in main list", !thumbImg);

        // TEST 12: Prominent Date and Details
        const dateEl = cardRow ? cardRow.querySelector('.record-date') : null;
        assert("Saved record displays .record-date element prominently", !!dateEl && dateEl.textContent.length > 0);
        const siteEl = cardRow ? cardRow.querySelector('.record-site') : null;
        assert("Saved record displays site 'Mabini Site A'", siteEl && siteEl.textContent.trim().includes("Mabini"));
        const campEl = cardRow ? cardRow.querySelector('.record-campaign') : null;
        assert("Saved record displays campaign", !!campEl && campEl.textContent.trim().length > 0);
        const respEl = cardRow ? cardRow.querySelector('.record-resp') : null;
        assert("Saved record displays supervisor/respondent", !!respEl && respEl.textContent.trim().length > 0);

        // Status chips: SS chip present for card with screenshot
        const ssChip = cardRow ? cardRow.querySelector('.status-chip.chip-ss') : null;
        assert("Card with screenshot displays 'SS' status chip", !!ssChip && ssChip.textContent.includes("SS"));

        // TEST 13: Report WITHOUT Screenshot does not have SS chip
        const sampleNoShot = {
          id: "test_edr_2_noshot",
          site: "Shaw Site B",
          date: "2026-09-10",
          timeObserved: "05:00:00 AM",
          supervisorRole: "OM",
          supervisorName: "Dutch Schaefer",
          subjectType: "Agent/s",
          subjectName: "Kyle Reese",
          account: "Healthcare",
          incident: "Phone violation",
          action: "Device surrendered",
          clipLink: "",
          screenshotData: "",
          selected: false,
          done: false
        };
        await edr.createOrUpdate(sampleNoShot);
        await edr.loadReports();
        await new Promise(r => setTimeout(r, 200));

        const cardNoShot = doc.querySelector(`.record-row[data-id="${sampleNoShot.id}"]`);
        assert("Second card without screenshot exists in DOM", !!cardNoShot);
        const noShotSsChip = cardNoShot ? cardNoShot.querySelector('.status-chip.chip-ss') : null;
        assert("Second card does NOT display 'SS' status chip", !noShotSsChip);

        // TEST 14: Action Buttons Arrangement & More Menu
        const liveCardRow = doc.querySelector(`.record-row[data-id="${sampleReport.id}"]`);
        const actionsWith = liveCardRow ? liveCardRow.querySelector('.record-actions') : null;
        assert("Card 1 has .record-actions", !!actionsWith);
        assert("Card 1 has View SS button", !!actionsWith.querySelector('.btn-shot-view'));
        assert("Card 1 has Send to CCTV Audit button", !!actionsWith.querySelector('.btn-audit-send'));
        assert("Card 1 has Done button", !!actionsWith.querySelector('.btn-done-toggle'));
        assert("Card 1 has Edit button", !!actionsWith.querySelector('.btn-edit'));
        assert("Card 1 has More menu trigger (⋯)", !!actionsWith.querySelector('.btn-more-trigger'));

        const moreMenu = actionsWith.querySelector('.record-dropdown-menu');
        assert("Card 1 has More dropdown menu", !!moreMenu);
        assert("More menu contains Copy SS", !!moreMenu.querySelector('.btn-shot-copy'));
        assert("More menu contains Replace SS", !!moreMenu.querySelector('.btn-shot-replace'));
        assert("More menu contains Remove SS", !!moreMenu.querySelector('.btn-shot-remove'));
        assert("More menu contains Delete EDR", !!moreMenu.querySelector('.btn-delete'));

        const actionsWithout = cardNoShot ? cardNoShot.querySelector('.record-actions') : null;
        assert("Card 2 has Add SS button", !!actionsWithout.querySelector('.btn-shot-add'));

        // TEST 15: Zero Horizontal Scrolling
        const listContainer = doc.getElementById("edrListContainer");
        assert("Container scrollWidth <= clientWidth (no horizontal scrollbar)", listContainer.scrollWidth <= listContainer.clientWidth + 1, `scrollWidth: ${listContainer.scrollWidth}, clientWidth: ${listContainer.clientWidth}`);
        const contStyle = win.getComputedStyle(listContainer);
        assert("Container CSS overflow-x is hidden", contStyle.overflowX === "hidden");
        assert("Card 1 scrollWidth <= clientWidth", liveCardRow.scrollWidth <= liveCardRow.clientWidth + 1);
        assert("Card 2 scrollWidth <= clientWidth", cardNoShot.scrollWidth <= cardNoShot.clientWidth + 1);

        // TEST 16: Confirmation 'Show' Action is REMOVED
        const allSavedButtons = Array.from(listContainer.querySelectorAll('button')).map(b => b.textContent.trim());
        const hasShowAction = allSavedButtons.some(t => t.toLowerCase() === "show");
        assert("No 'Show' action button exists in Saved EDR list", !hasShowAction, `Found buttons: ${allSavedButtons.join(', ')}`);

        // TEST 17: Click View SS opens Screenshot Viewer Modal
        const btnViewSs = liveCardRow ? liveCardRow.querySelector('.btn-shot-view') : null;
        if (btnViewSs) {
          btnViewSs.click();
          await new Promise(r => setTimeout(r, 100));
        }
        const viewerModal = doc.getElementById("modalScreenshotViewer");
        const viewerImg = doc.getElementById("screenshotViewerImg");
        assert("Clicking 'View SS' opens #modalScreenshotViewer", viewerModal && viewerModal.hidden === false);
        assert("Viewer modal displays full screenshot", viewerImg && viewerImg.src.startsWith("data:image"));

        // Close viewer
        doc.getElementById("btnCloseScreenshotViewer")?.click();
        assert("Closing viewer modal hides it", viewerModal && viewerModal.hidden === true);

        // TEST 14: EDR Template Helper & Reload Saved EDRs Button
        const btnTemplate = doc.getElementById("btnOpenTemplate");
        assert("Open EDR Template button exists in topbar", !!btnTemplate);
        assert("EDR Template link points to official Google Docs template", btnTemplate && btnTemplate.href.includes("docs.google.com/document/d/1-i54dxMosFgiNcdEO7fHqvN15yIsicdOjmsW0XTYbUw"));
        const btnReloadDocs = doc.getElementById("btnReloadDocs");
        assert("Reload Saved EDRs button exists in topbar", !!btnReloadDocs);

        // TEST 15: Option Management (+ / -) Buttons
        assert("btnAddSupervisorOption exists", !!doc.getElementById("btnAddSupervisorOption"));
        assert("btnRemoveSupervisorOption exists", !!doc.getElementById("btnRemoveSupervisorOption"));
        assert("btnAddAccountOption exists", !!doc.getElementById("btnAddAccountOption"));
        assert("btnRemoveAccountOption exists", !!doc.getElementById("btnRemoveAccountOption"));

        // TEST 16: Draft Persistence in cctv_edr_workspace_v2
        const sampleDraft = {
          site: "Mabini Site B - 3rd Floor",
          date: "2026-09-10",
          timeObserved: "04:30 AM",
          supervisorRole: "OM",
          supervisorName: "Alfeche, Llyr",
          omName: "Alfeche, Llyr",
          subjectType: "Agent/s",
          subjectName: "Draft Agent Test",
          account: "Draft Campaign Test",
          incident: "Draft incident description",
          action: "Draft remarks text",
          clipLink: "https://drive.google.com/draft"
        };
        await edr.saveDraftForm(sampleDraft);
        const retrievedDraft = edr.getDraftForm();
        assert("Draft form saved and retrievable via getDraftForm()", retrievedDraft && retrievedDraft.subjectName === "Draft Agent Test");
        const wsSnapshot = await edr.readWorkspaceDb();
        assert("Draft form persisted inside cctv_edr_workspace_v2", wsSnapshot && wsSnapshot.form && wsSnapshot.form.subjectName === "Draft Agent Test");

        // TEST 17: Send to CCTV Audit Parity
        assert("btnSendFormToAudit exists in form footer", !!doc.getElementById("btnSendFormToAudit"));
        assert("btnSendSelectedToAudit exists in dispatch header", !!doc.getElementById("btnSendSelectedToAudit"));
        const auditResult = edr.sendReportToAudit(sampleReport);
        assert("sendReportToAudit returns created/updated status", auditResult && (auditResult.action === "created" || auditResult.action === "updated"));
        assert("isReportInAudit returns true", edr.isReportInAudit(sampleReport.id) === true);

        // TEST 18: EDR Title Check
        const mainTitle = doc.querySelector(".workspace-main-title");
        assert("Main title is 'End of the Day Report'", mainTitle && mainTitle.textContent.trim() === "End of the Day Report");
        const navLabel = doc.querySelector("#tabEdr .nav-label");
        assert("Sidebar tab label is 'EDR'", navLabel && navLabel.textContent.trim() === "EDR");

      } catch (err) {
        assert("Execution error", false, err.stack || err.message);
      }

      // Output results
      const totalPassed = results.filter(r => r.passed).length;
      const totalFailed = results.filter(r => !r.passed).length;
      const summary = `RESULTS: ${totalPassed} passed, ${totalFailed} failed out of ${results.length} assertions`;

      const div = document.getElementById("results");
      div.innerHTML = `<h2>${summary}</h2><ul>` +
        results.map(r => `<li style="color:${r.passed ? 'green' : 'red'}">${r.passed ? 'Γ£ô' : 'Γ£ù'} <strong>${r.name}</strong> ${r.detail ? '(' + r.detail + ')' : ''}</li>`).join("") +
        `</ul>`;

      // Send to server report endpoint
      try {
        await fetch("http://localhost:8080/api/test_report", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ summary, totalPassed, totalFailed, results })
        });
      } catch (_) {}
    };
  </script>


</body></html>
