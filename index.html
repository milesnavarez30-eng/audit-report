<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCTV Audit Generator - Dark Mode</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #121212; 
            color: #e0e0e0; 
            max-width: 900px; 
            margin: 40px auto; 
            padding: 20px; 
        }
        .container { 
            background: #1e1e1e; 
            padding: 30px; 
            border-radius: 8px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); 
        }
        h2 { 
            margin-top: 0; 
            color: #64b5f6; 
            border-bottom: 2px solid #333; 
            padding-bottom: 15px; 
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .form-group { margin-bottom: 10px; }
        .form-group.full-width { grid-column: 1 / -1; }
        
        label { 
            display: block; 
            font-weight: bold; 
            margin-bottom: 5px; 
            font-size: 13px; 
            color: #bbb;
        }
        input[type="text"], input[type="date"], select { 
            width: 100%; 
            padding: 10px; 
            background-color: #2c2c2c;
            color: #fff;
            border: 1px solid #444; 
            border-radius: 4px; 
            box-sizing: border-box; 
            font-family: inherit; 
        }
        input:focus, select:focus {
            outline: none;
            border-color: #64b5f6;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        button { 
            background-color: #1976d2; 
            color: white; 
            border: none; 
            padding: 12px 20px; 
            font-size: 15px; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: bold; 
            flex: 1;
            transition: background-color 0.2s;
        }
        button:hover { background-color: #1565c0; }
        button.clear-btn { background-color: #d32f2f; }
        button.clear-btn:hover { background-color: #b71c1c; }
        button.copy-btn { background-color: #388e3c; }
        button.copy-btn:hover { background-color: #2e7d32; }

        .output-section { margin-top: 30px; }
        textarea { 
            width: 100%; 
            height: 200px; 
            padding: 10px; 
            background-color: #121212;
            color: #aed581;
            border: 1px solid #444; 
            border-radius: 4px; 
            box-sizing: border-box; 
            resize: vertical; 
            font-family: monospace; 
            white-space: pre; 
        }
    </style>
</head>
<body>

<div class="container">
    <h2>CCTV Audit Generator (Multi-Entry)</h2>
    
    <div class="form-grid">
        <div class="form-group">
            <label for="auditDate">Date of Audit</label>
            <input type="date" id="auditDate" required>
        </div>

        <div class="form-group">
            <label for="site">Site</label>
            <select id="site">
                <option value="Mabini Site A">Mabini Site A</option>
                <option value="Mabini Site B">Mabini Site B</option>
            </select>
        </div>

        <div class="form-group">
            <label for="tlName">TL Name</label>
            <input type="text" id="tlName" placeholder="Enter TL Name">
        </div>

        <div class="form-group">
            <label for="agentName">Agent Name</label>
            <input type="text" id="agentName" placeholder="Enter Agent Name">
        </div>

        <div class="form-group full-width">
            <label for="account">Account / Campaign (Auto-maps to OM)</label>
            <select id="account">
                <option value="">-- Select Account --</option>
                <!-- Options populated by JS -->
            </select>
        </div>

        <div class="form-group">
            <label for="reasonCode">CCTV Reason Code</label>
            <select id="reasonCode">
                <option value="SLEEPING">SLEEPING</option>
                <option value="DRESS CODE">DRESS CODE</option>
                <option value="BROWSING">BROWSING</option>
                <option value="WASTING TIME">WASTING TIME</option>
                <option value="BRINGING NON-WOF">BRINGING NON-WOF</option>
                <option value="EATING">EATING</option>
                <option value="IMPROPER HOUSE KEEPING">IMPROPER HOUSE KEEPING</option>
                <option value="EQUIPMENT TAMPERING">EQUIPMENT TAMPERING</option>
                <option value="PDA">PDA</option>
                <option value="DISORDERLY CONDUCT">DISORDERLY CONDUCT</option>
                <option value="USING SMARTPHONE">USING SMARTPHONE</option>
                <option value="THEFT">THEFT</option>
                <option value="SELLING">SELLING</option>
            </select>
        </div>

        <div class="form-group">
            <label for="noc">NOC (Report Status)</label>
            <select id="noc">
                <option value="Yes">Yes</option>
                <option value="No">No</option>
                <option value="Pending">Pending</option>
                <option value="Disputed">Disputed</option>
            </select>
        </div>

        <div class="form-group full-width">
            <label for="remarks">Remarks (Keep short and summarized)</label>
            <input type="text" id="remarks" placeholder="Brief summary of the incident">
        </div>
    </div>

    <div class="button-group">
        <button onclick="addEntry()">➕ Add Entry to List</button>
        <button onclick="clearForm()" class="clear-btn" style="flex: 0.5;">Clear Form</button>
    </div>

    <div class="output-section">
        <label for="outputText">Compiled Google Sheets Output (Tab Separated)</label>
        <textarea id="outputText" readonly placeholder="Your entries will appear here..."></textarea>
        
        <div class="button-group">
            <button class="copy-btn" onclick="copyToClipboard()">📋 Copy All Entries</button>
            <button class="clear-btn" onclick="clearOutput()" style="flex: 0.3;">🗑️ Clear List</button>
        </div>
    </div>
</div>

    window.onload = function() {
        const select = document.getElementById("account");
        const sortedAccounts = Object.keys(accountMapping).sort();
        sortedAccounts.forEach(acc => {
            const option = document.createElement("option");
            option.value = acc;
            option.textContent = acc;
            select.appendChild(option);
        });
    };

    function addEntry() {
        const dateInput = document.getElementById("auditDate").value;
        if (!dateInput) {
            alert("Please select a date.");
            return;
        }

        const dateObj = new Date(dateInput);
        const year = dateObj.getFullYear();
        const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        const month = months[dateObj.getMonth()];
        const formattedDate = `${dateObj.getMonth() + 1}/${dateObj.getDate()}/${year}`;

        const auditorName = "Miles";
        const site = document.getElementById("site").value;
        const tlName = document.getElementById("tlName").value || "N/A";
        const agentName = document.getElementById("agentName").value || "N/A";
        const accountSelection = document.getElementById("account").value;
        const reasonCode = document.getElementById("reasonCode").value;
        const noc = document.getElementById("noc").value;
        const remarks = document.getElementById("remarks").value || "N/A";

        if (!accountSelection) {
            alert("Please select an Account.");
            return;
        }

        const omName = accountMapping[accountSelection];
        const cleanAccount = accountSelection.replace(/\s\([^)]+\)/, '');

        // Generate Tab-Separated String aligned with columns: 
        // Month | Date | Name | OM | SITE | TL | Agent Name | Account | CCTV Reason Codes | NOC | Remarks
        const rowData = [
            month,
            formattedDate,
            auditorName,
            omName,
            site,
            tlName,
            agentName,
            cleanAccount,
            reasonCode,
            noc,
            remarks
        ].join('\t');

        const outputBox = document.getElementById("outputText");
        if (outputBox.value.trim() === "") {
            outputBox.value = rowData;
        } else {
            outputBox.value += "\n" + rowData;
        }
        
        // Data is intentionally NOT cleared here so you can reuse it for multiple entries.
    }

    function copyToClipboard() {
        const copyText = document.getElementById("outputText");
        if (!copyText.value) return;
        
        copyText.select();
        document.execCommand("copy");
        alert("All entries copied to clipboard! Paste directly into Google Sheets.");
    }

    function clearOutput() {
        if(confirm("Are you sure you want to clear the compiled list?")) {
            document.getElementById("outputText").value = "";
        }
    }

    function clearForm() {
        document.getElementById("auditDate").value = "";
        document.getElementById("tlName").value = "";
        document.getElementById("agentName").value = "";
        document.getElementById("account").value = "";
        document.getElementById("remarks").value = "";
        document.getElementById("noc").value = "Yes";
    }
