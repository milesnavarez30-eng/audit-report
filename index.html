<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCTV Audit Generator</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #f4f6f8; 
            color: #333333; 
            max-width: 1000px; 
            margin: 40px auto; 
            padding: 20px; 
        }
        .container { 
            background: #ffffff; 
            padding: 30px; 
            border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
        }
        h2 { 
            margin-top: 0; 
            color: #1976d2; 
            border-bottom: 2px solid #eeeeee; 
            padding-bottom: 15px; 
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .form-group { margin-bottom: 10px; }
        .form-group.full-width { grid-column: 1 / -1; }
        
        label { 
            display: block; 
            font-weight: 600; 
            margin-bottom: 5px; 
            font-size: 13px; 
            color: #555555;
        }
        
        .input-group {
            display: flex;
            gap: 8px;
        }
        
        input[type="text"], input[type="date"], select { 
            width: 100%; 
            padding: 10px; 
            background-color: #ffffff;
            color: #333333;
            border: 1px solid #cccccc; 
            border-radius: 4px; 
            box-sizing: border-box; 
            font-family: inherit;
            transition: border-color 0.2s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #1976d2;
            box-shadow: 0 0 0 2px rgba(25, 118, 210, 0.1);
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        button { 
            background-color: #1976d2; 
            color: white; 
            border: none; 
            padding: 12px 20px; 
            font-size: 15px; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: bold; 
            flex: 1;
            transition: background-color 0.2s;
        }
        button:hover { background-color: #1565c0; }
        
        button.add-btn, button.remove-btn {
            flex: 0 0 45px;
            padding: 0;
            font-size: 20px;
            border-radius: 4px;
            border: 1px solid #cccccc;
            color: #333333;
        }
        button.add-btn { background-color: #f5f5f5; }
        button.add-btn:hover { background-color: #e0e0e0; }
        
        button.remove-btn { background-color: #ffebee; color: #d32f2f; border-color: #ffcdd2; }
        button.remove-btn:hover { background-color: #ffcdd2; color: #b71c1c; }
        
        button.clear-btn { background-color: #d32f2f; }
        button.clear-btn:hover { background-color: #b71c1c; }
        button.copy-btn { background-color: #388e3c; }
        button.copy-btn:hover { background-color: #2e7d32; }
        
        /* Action buttons in the table */
        .action-btns {
            display: flex;
            gap: 5px;
            justify-content: center;
        }
        button.edit-btn {
            background-color: #f57c00;
            color: white;
            padding: 4px 8px;
            font-size: 12px;
            flex: none;
            width: auto;
            border: none;
        }
        button.edit-btn:hover { background-color: #e65100; }
        
        button.delete-btn {
            background-color: #d32f2f;
            color: white;
            padding: 4px 8px;
            font-size: 12px;
            flex: none;
            width: auto;
            border: none;
        }
        button.delete-btn:hover { background-color: #b71c1c; }

        .output-section { margin-top: 30px; }
        
        /* Table Styles for the UI */
        .table-container {
            width: 100%;
            max-height: 250px;
            overflow-y: auto;
            background-color: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            margin-bottom: 15px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th, td {
            padding: 8px 12px;
            border-bottom: 1px solid #eeeeee;
            text-align: center; /* Preview alignment */
            white-space: nowrap;
        }
        th {
            background-color: #f8f9fa;
            color: #1976d2;
            position: sticky;
            top: 0;
            z-index: 1;
            border-bottom: 2px solid #e0e0e0;
        }
        td.remarks-col {
            text-align: left;
            white-space: normal;
        }
        
    </style>
</head>
<body>

<div class="container">
    <h2>CCTV Audit Generator</h2>
    
    <div class="form-grid">
        <div class="form-group">
            <label for="auditDate">Date of Audit</label>
            <input type="date" id="auditDate" required>
        </div>

        <div class="form-group">
            <label for="site">Site</label>
            <div class="input-group">
                <select id="site">
                    <option value="Mabini Site A">Mabini Site A</option>
                    <option value="Mabini Site B">Mabini Site B</option>
                </select>
                <button type="button" class="add-btn" onclick="addNewOption('site', 'New Site Name')" title="Add New Site">+</button>
                <button type="button" class="remove-btn" onclick="removeSelectedOption('site')" title="Delete Selected Site">-</button>
            </div>
        </div>

        <div class="form-group">
            <label for="tlName">TL Name</label>
            <input type="text" id="tlName" placeholder="Enter TL Name">
        </div>

        <div class="form-group">
            <label for="agentName">Agent Name</label>
            <input type="text" id="agentName" placeholder="Enter Agent Name">
        </div>

        <div class="form-group full-width">
            <label for="account">Account / Campaign (Auto-maps to OM)</label>
            <div class="input-group">
                <select id="account">
                    <option value="">-- Select Account --</option>
                    <!-- Options populated by JS -->
                </select>
                <button type="button" class="add-btn" onclick="addNewAccount()" title="Add New Account">+</button>
                <button type="button" class="remove-btn" onclick="removeSelectedOption('account')" title="Delete Selected Account">-</button>
            </div>
        </div>

        <div class="form-group">
            <label for="reasonCode">CCTV Reason Code</label>
            <div class="input-group">
                <select id="reasonCode">
                    <option value="SLEEPING">SLEEPING</option>
                    <option value="DRESS CODE">DRESS CODE</option>
                    <option value="BROWSING">BROWSING</option>
                    <option value="WASTING TIME">WASTING TIME</option>
                    <option value="BRINGING NON-WOF">BRINGING NON-WOF</option>
                    <option value="EATING">EATING</option>
                    <option value="IMPROPER HOUSE KEEPING">IMPROPER HOUSE KEEPING</option>
                    <option value="EQUIPMENT TAMPERING">EQUIPMENT TAMPERING</option>
                    <option value="PDA">PDA</option>
                    <option value="DISORDERLY CONDUCT">DISORDERLY CONDUCT</option>
                    <option value="USING SMARTPHONE">USING SMARTPHONE</option>
                    <option value="THEFT">THEFT</option>
                    <option value="SELLING">SELLING</option>
                </select>
                <button type="button" class="add-btn" onclick="addNewOption('reasonCode', 'New Reason Code')" title="Add New Reason Code">+</button>
                <button type="button" class="remove-btn" onclick="removeSelectedOption('reasonCode')" title="Delete Selected Reason Code">-</button>
            </div>
        </div>

        <div class="form-group">
            <label for="noc">NOC (Report Status)</label>
            <select id="noc">
                <option value="Yes">Yes</option>
                <option value="No">No</option>
                <option value="Pending">Pending</option>
                <option value="Disputed">Disputed</option>
            </select>
        </div>

        <div class="form-group full-width">
            <label for="remarks">Remarks (Keep short and summarized)</label>
            <input type="text" id="remarks" placeholder="Brief summary of the incident">
        </div>
    </div>

    <div class="button-group">
        <button id="addUpdateBtn" onclick="submitEntry()">➕ Add Entry to List</button>
        <button onclick="clearForm()" class="clear-btn" style="flex: 0.5;">Clear Form</button>
    </div>

    <div class="output-section">
        <label>Compiled Google Sheets Output (Manage Entries)</label>
        
        <div class="table-container">
            <table id="outputTable">
                <thead>
                    <tr>
                        <th>Actions</th>
                        <th>Year</th>
                        <th>Month</th>
                        <th>Date</th>
                        <th>Name</th>
                        <th>OM</th>
                        <th>SITE</th>
                        <th>TL Name</th>
                        <th>Agent Name</th>
                        <th>Account</th>
                        <th>CCTV Reason</th>
                        <th>NOC</th>
                        <th>Remarks</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Entries will populate here -->
                </tbody>
            </table>
        </div>
        
        <div class="button-group">
            <button class="copy-btn" onclick="copyToClipboard()">📋 Copy All Entries (Centered Format)</button>
            <button class="clear-btn" onclick="clearOutput()" style="flex: 0.3;">🗑️ Clear All</button>
        </div>
    </div>
</div>

<script>
    // Global Arrays and Variables
    let entryList = [];
    let editingIndex = -1; // -1 means we are adding a new entry, otherwise it's the index we are editing

    // OM to Account Mapping Data
    const accountMapping = {
        "123 Robotics (Abby)": "Abby",
        "123Employee | HUB International": "Abby",
        "Dental Back Office Admin": "Abby",
        "BIGO - Mabini": "Irene",
        "AU Store": "Cherry",
        "123 Employee (Crystal)": "Crystal",
        "BrightDelivery": "Derline",
        "Airbills": "Freda",
        "AFP": "Irene",
        "Shopee - QA (Marc Jardenico)": "Marc Jardenico",
        "TEMU - 1404": "McJordan",
        "AMG": "Michelle",
        "All Pro Pay": "Mirah",
        "ACB": "Mogan",
        "AMR": "Norman",
        "Allen Institute Mouse": "Renato",
        "AHABI": "Rhelford",
        "EIMS": "Ruth",
        "123 Employee (Shayne)": "Shayne",
        "DASCO": "Sheila",
        "212 Dental Care": "Shey",
        "Shopee - Buyer Chat and Email (James)": "SP - James",
        "Shopee - Buybox (Marc)": "SP - Marc",
        "Shopee - Buybox (MJ)": "SP - MJ",
        "123 Employee (Willy)": "Willy"
        // (Truncated for readability, you can safely paste back your full list in your code here)
    };

    window.onload = function() {
        populateAccounts();
    };

    function populateAccounts() {
        const select = document.getElementById("account");
        select.innerHTML = '<option value="">-- Select Account --</option>'; // Reset
        const sortedAccounts = Object.keys(accountMapping).sort();
        sortedAccounts.forEach(acc => {
            const option = document.createElement("option");
            option.value = acc;
            option.textContent = acc;
            select.appendChild(option);
        });
    }

    // Function to add general options (Site, Reason Code)
    function addNewOption(selectId, promptText) {
        const select = document.getElementById(selectId);
        const newValue = prompt(`Enter ${promptText}:`);
        
        if (newValue && newValue.trim() !== "") {
            const option = document.createElement("option");
            option.value = newValue.trim();
            option.textContent = newValue.trim();
            select.appendChild(option);
            select.value = newValue.trim(); // Auto-select the new item
        }
    }

    // Specialized function for Accounts (Needs OM mapping)
    function addNewAccount() {
        const newAccount = prompt("Enter New Account Name:");
        if (newAccount && newAccount.trim() !== "") {
            const omName = prompt(`Enter OM Name for Account "${newAccount}":`);
            if (omName && omName.trim() !== "") {
                accountMapping[newAccount.trim()] = omName.trim();
                populateAccounts();
                document.getElementById("account").value = newAccount.trim();
                alert(`Added ${newAccount} under OM ${omName}`);
            } else {
                alert("Account creation cancelled. OM Name is required.");
            }
        }
    }

    // Function to remove the currently selected option
    function removeSelectedOption(selectId) {
        const select = document.getElementById(selectId);
        const selectedIndex = select.selectedIndex;
        
        if (selectedIndex === -1) return; // Nothing selected
        
        const selectedOption = select.options[selectedIndex];
        const valueToRemove = selectedOption.value;

        // Prevent removing the default "-- Select Account --" placeholder
        if (selectId === 'account' && valueToRemove === "") {
            alert("You cannot remove the default placeholder.");
            return;
        }

        const confirmDelete = confirm(`Are you sure you want to delete "${selectedOption.text}" from the dropdown?`);
        
        if (confirmDelete) {
            // If deleting an account, also remove it from the background mapping
            if (selectId === 'account') {
                delete accountMapping[valueToRemove];
            }
            
            // Remove the element from the dropdown
            select.remove(selectedIndex);
        }
    }

    function submitEntry() {
        const dateInput = document.getElementById("auditDate").value;
        if (!dateInput) {
            alert("Please select a date.");
            return;
        }

        const dateObj = new Date(dateInput);
        const year = dateObj.getFullYear();
        const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        const month = months[dateObj.getMonth()];
        const formattedDate = `${dateObj.getMonth() + 1}/${dateObj.getDate()}/${year}`;

        const auditorName = "Miles";
        const site = document.getElementById("site").value;
        const tlName = document.getElementById("tlName").value || "N/A";
        const agentName = document.getElementById("agentName").value || "N/A";
        const accountSelection = document.getElementById("account").value;
        const reasonCode = document.getElementById("reasonCode").value;
        const noc = document.getElementById("noc").value;
        const remarks = document.getElementById("remarks").value || "N/A";

        if (!accountSelection) {
            alert("Please select an Account.");
            return;
        }

        const omName = accountMapping[accountSelection];
        const cleanAccount = accountSelection.replace(/\s\([^)]+\)/, '');

        // Store into object
        const entry = {
            rawDate: dateInput, // Needed for populating the form later when editing
            year, month, formattedDate, auditorName, omName, site, 
            tlName, agentName, 
            rawAccount: accountSelection, // Needed for populating the dropdown
            cleanAccount, reasonCode, noc, remarks
        };
        
        if (editingIndex === -1) {
            // Add new entry
            entryList.push(entry);
        } else {
            // Update existing entry
            entryList[editingIndex] = entry;
            // Reset state
            editingIndex = -1;
            document.getElementById("addUpdateBtn").innerHTML = "➕ Add Entry to List";
        }
        
        renderTable();
        clearForm(); // clears inputs so you can enter the next one
    }

    function editEntry(index) {
        const entry = entryList[index];
        
        document.getElementById("auditDate").value = entry.rawDate;
        document.getElementById("site").value = entry.site;
        document.getElementById("tlName").value = entry.tlName;
        document.getElementById("agentName").value = entry.agentName;
        document.getElementById("account").value = entry.rawAccount;
        document.getElementById("reasonCode").value = entry.reasonCode;
        document.getElementById("noc").value = entry.noc;
        document.getElementById("remarks").value = entry.remarks;

        editingIndex = index;
        document.getElementById("addUpdateBtn").innerHTML = "💾 Update Entry";
    }

    function deleteEntry(index) {
        if (editingIndex === index) {
            // If they try to delete the entry they are currently editing, clear the form
            clearForm();
        } else if (editingIndex > index) {
            // If they delete an item BEFORE the one they are currently editing, shift the index down
            editingIndex--;
        }
        
        entryList.splice(index, 1);
        renderTable();
    }

    function renderTable() {
        const tbody = document.querySelector("#outputTable tbody");
        tbody.innerHTML = "";
        
        entryList.forEach((entry, index) => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>
                    <div class="action-btns">
                        <button class="edit-btn" onclick="editEntry(${index})" title="Edit Row">✏️</button>
                        <button class="delete-btn" onclick="deleteEntry(${index})" title="Remove Row">❌</button>
                    </div>
                </td>
                <td>${entry.year}</td>
                <td>${entry.month}</td>
                <td>${entry.formattedDate}</td>
                <td>${entry.auditorName}</td>
                <td>${entry.omName}</td>
                <td>${entry.site}</td>
                <td>${entry.tlName}</td>
                <td>${entry.agentName}</td>
                <td>${entry.cleanAccount}</td>
                <td>${entry.reasonCode}</td>
                <td>${entry.noc}</td>
                <td class="remarks-col">${entry.remarks}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    function copyToClipboard() {
        if (entryList.length === 0) {
            alert("No entries to copy!");
            return;
        }

        // We create a temporary, hidden HTML table to force Google Sheets to read formatting
        const tempDiv = document.createElement("div");
        tempDiv.style.position = "absolute";
        tempDiv.style.left = "-9999px";
        
        let tableHTML = "<table><tbody>";
        
        entryList.forEach(entry => {
            // Apply text-align: center to the specific columns requested
            tableHTML += `
                <tr>
                    <td style="text-align: center;">${entry.year}</td>
                    <td style="text-align: center;">${entry.month}</td>
                    <td style="text-align: center;">${entry.formattedDate}</td>
                    <td style="text-align: center;">${entry.auditorName}</td>
                    <td style="text-align: center;">${entry.omName}</td>
                    <td style="text-align: center;">${entry.site}</td>
                    <td style="text-align: center;">${entry.tlName}</td>
                    <td style="text-align: center;">${entry.agentName}</td>
                    <td style="text-align: center;">${entry.cleanAccount}</td>
                    <td style="text-align: center;">${entry.reasonCode}</td>
                    <td style="text-align: center;">${entry.noc}</td>
                    <td>${entry.remarks}</td>
                </tr>
            `;
        });
        
        tableHTML += "</tbody></table>";
        tempDiv.innerHTML = tableHTML;
        document.body.appendChild(tempDiv);

        // Select and copy the HTML table
        const range = document.createRange();
        range.selectNodeContents(tempDiv);
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);

        try {
            document.execCommand('copy');
            alert("All entries copied! You can now paste into Google Sheets and they will be centered.");
        } catch (err) {
            alert("Failed to copy data.");
        }

        // Clean up
        selection.removeAllRanges();
        document.body.removeChild(tempDiv);
    }

    function clearOutput() {
        if(confirm("Are you sure you want to clear all compiled entries?")) {
            entryList = [];
            editingIndex = -1;
            document.getElementById("addUpdateBtn").innerHTML = "➕ Add Entry to List";
            renderTable();
        }
    }

    function clearForm() {
        document.getElementById("auditDate").value = "";
        document.getElementById("tlName").value = "";
        document.getElementById("agentName").value = "";
        document.getElementById("account").value = "";
        document.getElementById("remarks").value = "";
        document.getElementById("noc").value = "Yes";
        
        editingIndex = -1;
        document.getElementById("addUpdateBtn").innerHTML = "➕ Add Entry to List";
    }
</script>

</body>
</html>
