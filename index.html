<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CCTV Audit Generator</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #000000;
            --container-bg: rgba(9, 9, 11, 0.82); 
            --text-color: #e0e0e0;
            --label-color: #d8b4fe; 
            --input-bg: #121212;
            --input-border: #2a103c;
            --primary-color: #b026ff; 
            --primary-hover: #c455ff;
            --border-color: #2a103c;
            --danger-bg: #ef4444;
            --success-bg: #10b981;
            --warning-bg: #f59e0b;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            max-width: 1000px; 
            margin: 0 auto; 
            padding: 20px 10px; 
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Fullscreen Canvas for Nyan Cat & Rainbow */
        #nyanCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
        }
        
        .container { 
            background: var(--container-bg); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 30px; 
            border-radius: 12px; 
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 32px rgba(176, 38, 255, 0.15); 
            margin-bottom: 30px;
        }
