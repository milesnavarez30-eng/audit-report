<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCTV Audit Generator</title>
    
    <!-- Import Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        /* Dark Mode + Neon Purple Theme Variables */
        :root {
            --bg-color: #000000;
            --container-bg: rgba(9, 9, 11, 0.75); /* Semi-transparent for glass effect */
            --text-color: #e0e0e0;
            --label-color: #d8b4fe; 
            --input-bg: #121212;
            --input-border: #2a103c;
            --primary-color: #b026ff; 
            --primary-hover: #c455ff;
            --border-color: #2a103c;
            --danger-bg: #ef4444;
            --success-bg: #10b981;
            --warning-bg: #f59e0b;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            max-width: 1000px; 
            margin: 40px auto; 
            padding: 20px; 
            overflow-x: hidden; /* Prevent horizontal scrollbar from cat */
        }

        /* Nyan Cat Styles */
        #nyanCat {
            position: fixed;
            top: 0;
            left: 0;
            width: 180px; /* Size of the cat */
            z-index: -1; /* Puts it behind everything */
            pointer-events: none; /* Prevents it from blocking clicks */
            transition: transform 0.1s; /* Smooth flip when changing direction */
        }
        
        .container { 
            background: var(--container-bg); 
            backdrop-filter: blur(12px); /* Glassmorphism Blur */
            -webkit-backdrop-filter: blur(12px);
            padding: 30px; 
            border-radius: 12px; 
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 32px rgba(176, 38, 255, 0.15); 
        }

        h2 { 
            margin-top: 0; 
            color: var(--primary-color); 
            border-bottom: 1px solid var(--border-color); 
            padding-bottom: 15px; 
            font-weight: 700;
            letter-spacing: -0.5px;
            text-transform: uppercase;
        }

        /* Asymmetric Grid Layout */
        .form-grid {
            display: grid;
            grid-template-columns: 1.5fr 1fr 1.5fr; 
            gap: 15px;
        }
        
        .field-date { grid-column: 1 / 2; }
        .field-site { grid-column: 2 / 4; }
        .field-tl { grid-column: 1 / 3; }
        .field-agent { grid-column: 3 / 4; }
        .field-om { grid-column: 1 / 2; }
        .field-account { grid-column: 2 / 4; }
        .field-reason { grid-column: 1 / 3; }
        .field-noc { grid-column: 3 / 4; }
        .field-remarks { grid-column: 1 / -1; } 
        
        label { 
            display: block; 
            font-weight: 600; 
            margin-bottom: 6px; 
            font-size: 13px; 
            color: var(--label-color);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .input-group {
            display: flex;
            gap: 8px;
        }
        
        input[type="text"], input[type="date"], select { 
            width: 100%; 
            padding: 12px; 
            background-color: var(--input-bg);
            color: #ffffff;
            border: 1px solid var(--input-border); 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-family: inherit;
            font-size: 14px;
            transition: all 0.3s ease;
            color-scheme: dark; 
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 12px rgba(176, 38, 255, 0.4); 
        }
        
        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }
        
        button { 
            background-color: var(--primary-color); 
            color: #ffffff; 
            border: none; 
            padding: 12px 20px; 
            font-size: 14px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: 600; 
            flex: 1;
            transition: all 0.2s ease;
            letter-spacing: 0.5px;
        }
        button:hover { 
            background-color: var(--primary-hover); 
            box-shadow: 0 0 15px rgba(176, 38, 255, 0.5);
        }
        
        button.add-btn, button.remove-btn {
            flex: 0 0 45px;
            padding: 0;
            font-size: 20px;
            border-radius: 6px;
            border: 1px solid var(--input-border);
        }
        button.add-btn { background-color: #1a1a1a; color: var(--primary-color); }
        button.add-btn:hover { background-color: #2a2a2a; border-color: var(--primary-color); }
        
        button.remove-btn { background-color: #1a0505; color: var(--danger-bg); border-color: #3f0f0f; }
        button.remove-btn:hover { background-color: #2a0808; border-color: var(--danger-bg); }
        
        button.clear-btn { background-color: transparent; border: 1px solid var(--danger-bg); color: var(--danger-bg); }
        button.clear-btn:hover { background-color: var(--danger-bg); color: #fff; box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }
        
        button.copy-btn { background-color: var(--success-bg); }
        button.copy-btn:hover { background-color: #34d399; box-shadow: 0 0 15px rgba(16, 185, 129, 0.4); }
        
        .action-btns {
            display: flex;
            gap: 5px;
            justify-content: center;
        }
        button.edit-btn, button.delete-btn {
            padding: 4px 8px; font-size: 12px; flex: none; width: auto; border-radius: 4px; border: none;
        }
        button.edit-btn { background-color: var(--warning-bg); color: #000; }
        button.edit-btn:hover { background-color: #fcd34d; }
        button.delete-btn { background-color: var(--danger-bg); color: white; }
        button.delete-btn:hover { background-color: #f87171; }

        .output-section { margin-top: 40px; }
        .output-section label { color: var(--primary-color); border-bottom: 1px solid var(--border-color); padding-bottom: 8px; margin-bottom: 15px; }
        
        .table-container {
            width: 100%;
            max-height: 250px;
            overflow-y: auto;
            background-color: rgba(18, 18, 18, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 15px;
        }
        
        .table-container::-webkit-scrollbar { width: 8px; height: 8px; }
        .table-container::-webkit-scrollbar-track { background: var(--bg-color); }
        .table-container::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
        .table-container::-webkit-scrollbar-thumb:hover { background: var(--primary-color); }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th, td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border-color);
            text-align: center; 
            white-space: nowrap;
        }
        th {
            background-color: #0c0414; 
            color: var(--primary-color);
            position: sticky;
            top: 0;
            z-index: 1;
            border-bottom: 1px solid var(--primary-color);
            font-weight: 600;
        }
        td.remarks-col {
            text-align: left;
            white-space: normal;
            min-width: 200px;
        }
        
    </style>
</head>
<body>

<!-- Nyan Cat Background Element -->
<img id="nyanCat" src="https://media.giphy.com/media/sIIhZliB2McAo/giphy.gif" alt="Nyan Cat">

<div class="container">
    <h2>CCTV Audit Generator</h2>
    
    <div class="form-grid">
        <div class="form-group field-date">
            <label for="auditDate">Date of Audit</label>
            <input type="date" id="auditDate" required>
        </div>

        <div class="form-group field-site">
            <label for="site">Site</label>
            <div class="input-group">
                <select id="site">
                    <option value="Mabini Site A">Mabini Site A</option>
                    <option value="Mabini Site B">Mabini Site B</option>
                </select>
                <button type="button" class="add-btn" onclick="addNewOption('site', 'New Site Name')" title="Add New Site">+</button>
                <button type="button" class="remove-btn" onclick="removeSelectedOption('site')" title="Delete Selected Site">-</button>
            </div>
        </div>

        <div class="form-group field-tl">
            <label for="tlName">TL Name</label>
            <input type="text" id="tlName" placeholder="Enter TL Name">
        </div>

        <div class="form-group field-agent">
            <label for="agentName">Agent Name</label>
            <input type="text" id="agentName" placeholder="Enter Agent Name">
        </div>

        <div class="form-group field-om">
            <label for="omName">OM Name</label>
            <div class="input-group">
                <select id="omName">
                    <!-- Populated by JS -->
                </select>
                <button type="button" class="add-btn" onclick="addNewOption('omName', 'New OM Name')" title="Add New OM">+</button>
                <button type="button" class="remove-btn" onclick="removeSelectedOption('omName')" title="Delete Selected OM">-</button>
            </div>
        </div>

        <div class="form-group field-account">
            <label for="account">Account / Campaign</label>
            <div class="input-group">
                <select id="account">
                    <!-- Populated by JS -->
                </select>
                <button type="button" class="add-btn" onclick="addNewOption('account', 'New Account/Campaign')" title="Add New Account">+</button>
                <button type="button" class="remove-btn" onclick="removeSelectedOption('account')" title="Delete Selected Account">-</button>
            </div>
        </div>

        <div class="form-group field-reason">
            <label for="reasonCode">CCTV Reason Code</label>
            <div class="input-group">
                <select id="reasonCode">
                    <option value="SLEEPING">SLEEPING</option>
                    <option value="DRESS CODE">DRESS CODE</option>
                    <option value="BROWSING">BROWSING</option>
                    <option value="WASTING TIME">WASTING TIME</option>
                    <option value="BRINGING NON-WOF">BRINGING NON-WOF</option>
                    <option value="EATING">EATING</option>
                    <option value="IMPROPER HOUSE KEEPING">IMPROPER HOUSE KEEPING</option>
                    <option value="EQUIPMENT TAMPERING">EQUIPMENT TAMPERING</option>
                    <option value="PDA">PDA</option>
                    <option value="DISORDERLY CONDUCT">DISORDERLY CONDUCT</option>
                    <option value="USING SMARTPHONE">USING SMARTPHONE</option>
                    <option value="THEFT">THEFT</option>
                    <option value="SELLING">SELLING</option>
                </select>
                <button type="button" class="add-btn" onclick="addNewOption('reasonCode', 'New Reason Code')" title="Add New Reason Code">+</button>
                <button type="button" class="remove-btn" onclick="removeSelectedOption('reasonCode')" title="Delete Selected Reason Code">-</button>
            </div>
        </div>

        <div class="form-group field-noc">
            <label for="noc">NOC (Status)</label>
            <select id="noc">
                <option value="Yes">Yes</option>
                <option value="No">No</option>
                <option value="Pending">Pending</option>
                <option value="Disputed">Disputed</option>
            </select>
        </div>

        <div class="form-group field-remarks">
            <label for="remarks">Remarks</label>
            <input type="text" id="remarks" placeholder="Brief summary of the incident">
        </div>
    </div>

    <div class="button-group">
        <button id="addUpdateBtn" onclick="submitEntry()">➕ Add Entry to List</button>
        <button onclick="clearForm()" class="clear-btn" style="flex: 0.3;">Clear Form</button>
    </div>

    <div class="output-section">
        <label>Data Output Grid</label>
        
        <div class="table-container">
            <table id="outputTable">
                <thead>
                    <tr>
                        <th>Actions</th>
                        <th>Year</th>
                        <th>Month</th>
                        <th>Date</th>
                        <th>Name</th>
                        <th>OM</th>
                        <th>SITE</th>
                        <th>TL Name</th>
                        <th>Agent Name</th>
                        <th>Account</th>
                        <th>CCTV Reason</th>
                        <th>NOC</th>
                        <th>Remarks</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Entries will populate here -->
                </tbody>
            </table>
        </div>
        
        <div class="button-group">
            <button class="copy-btn" onclick="copyToClipboard()">📋 Copy to Clipboard (Transparent for Sheets)</button>
            <button class="clear-btn" onclick="clearOutput()" style="flex: 0.3;">🗑️ Clear All</button>
        </div>
    </div>
</div>

<script>
    // --- NYAN CAT ANIMATION LOGIC ---
    const cat = document.getElementById('nyanCat');
    let posX = 0;
    let posY = 0;
    let speedX = 3; // Horizontal speed
    let speedY = 2; // Vertical speed
    let catWidth = 180; // Estimated GIF width
    let catHeight = 80; // Estimated GIF height

    function bounceCat() {
        let winWidth = window.innerWidth;
        let winHeight = window.innerHeight;

        posX += speedX;
        posY += speedY;

        // Bounce off left or right walls
        if (posX + catWidth >= winWidth || posX <= 0) {
            speedX = -speedX;
            // Flips the cat so it faces the direction it's running
            cat.style.transform = speedX > 0 ? "scaleX(1)" : "scaleX(-1)";
        }

        // Bounce off top or bottom walls
        if (posY + catHeight >= winHeight || posY <= 0) {
            speedY = -speedY;
        }

        cat.style.left = posX + 'px';
        cat.style.top = posY + 'px';

        requestAnimationFrame(bounceCat);
    }
    
    // Start the cat animation
    bounceCat();
    // --------------------------------

    let editingIndex = -1;

    const rawOmData = `Abby\nBIGO - Thirdy\nCFC\nCherry\nCrystal\nDerline\nFreda\nIrene\nMarc Jardenico\nMcJordan\nMichelle\nMirah\nMogan\nNorman\nRenato\nRhelford\nRuth\nShayne\nSheila\nShey\nSP - James\nSP - Marc\nSP - MJ\nWilly`;

    window.onload = function() {
        populateDropdown("account", rawCampaignData, "Account/Campaign");
        populateDropdown("omName", rawOmData, "OM");
    };

    function populateDropdown(selectId, rawData, labelText) {
        const select = document.getElementById(selectId);
        select.innerHTML = `<option value="">-- Select ${labelText} --</option>`;
        
        const arrayData = rawData.split('\n').map(s => s.trim()).filter(s => s !== "");
        const uniqueSorted = [...new Set(arrayData)].sort((a, b) => a.toLowerCase().localeCompare(b.toLowerCase()));
        
        uniqueSorted.forEach(item => {
            const option = document.createElement("option");
            option.value = item;
            option.textContent = item;
            select.appendChild(option);
        });
    }

    function addNewOption(selectId, promptText) {
        const select = document.getElementById(selectId);
        const newValue = prompt(`Enter ${promptText}:`);
        
        if (newValue && newValue.trim() !== "") {
            const option = document.createElement("option");
            option.value = newValue.trim();
            option.textContent = newValue.trim();
            select.appendChild(option);
            select.value = newValue.trim(); 
        }
    }

    function removeSelectedOption(selectId) {
        const select = document.getElementById(selectId);
        const selectedIndex = select.selectedIndex;
        
        if (selectedIndex <= 0) {
            alert("You cannot remove the default placeholder.");
            return;
        }
        
        const selectedOption = select.options[selectedIndex];
        if (confirm(`Are you sure you want to delete "${selectedOption.text}" from this dropdown?`)) {
            select.remove(selectedIndex);
        }
    }

    function submitEntry() {
        const dateInput = document.getElementById("auditDate").value;
        if (!dateInput) { alert("Please select a date."); return; }

        const dateObj = new Date(dateInput);
        const year = dateObj.getFullYear();
        const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        const month = months[dateObj.getMonth()];
        const formattedDate = `${dateObj.getMonth() + 1}/${dateObj.getDate()}/${year}`;

        const auditorName = "Miles"; 
        const site = document.getElementById("site").value;
        const tlName = document.getElementById("tlName").value || "N/A";
        const agentName = document.getElementById("agentName").value || "N/A";
        
        const omSelection = document.getElementById("omName").value;
        const accountSelection = document.getElementById("account").value;
        
        const reasonCode = document.getElementById("reasonCode").value;
        const noc = document.getElementById("noc").value;
        const remarks = document.getElementById("remarks").value || "N/A";

        if (!omSelection) { alert("Please select an OM."); return; }
        if (!accountSelection) { alert("Please select an Account."); return; }

        const entry = {
            rawDate: dateInput, 
            year, month, formattedDate, auditorName, 
            omName: omSelection, 
            site, tlName, agentName, 
            cleanAccount: accountSelection, 
            reasonCode, noc, remarks
        };
        
        if (editingIndex === -1) {
            entryList.push(entry);
        } else {
            entryList[editingIndex] = entry;
            editingIndex = -1;
            document.getElementById("addUpdateBtn").innerHTML = "➕ Add Entry to List";
        }
        
        renderTable();
    }

    function editEntry(index) {
        const entry = entryList[index];
        
        document.getElementById("auditDate").value = entry.rawDate;
        document.getElementById("site").value = entry.site;
        document.getElementById("tlName").value = entry.tlName;
        document.getElementById("agentName").value = entry.agentName;
        document.getElementById("omName").value = entry.omName;
        document.getElementById("account").value = entry.cleanAccount;
        document.getElementById("reasonCode").value = entry.reasonCode;
        document.getElementById("noc").value = entry.noc;
        document.getElementById("remarks").value = entry.remarks;

        editingIndex = index;
        document.getElementById("addUpdateBtn").innerHTML = "💾 Update Entry";
    }

    function deleteEntry(index) {
        if (editingIndex === index) {
            clearForm();
        } else if (editingIndex > index) {
            editingIndex--;
        }
        entryList.splice(index, 1);
        renderTable();
    }

    function renderTable() {
        const tbody = document.querySelector("#outputTable tbody");
        tbody.innerHTML = "";
        
        entryList.forEach((entry, index) => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>
                    <div class="action-btns">
                        <button class="edit-btn" onclick="editEntry(${index})" title="Edit Row">✏️</button>
                        <button class="delete-btn" onclick="deleteEntry(${index})" title="Remove Row">❌</button>
                    </div>
                </td>
                <td>${entry.year}</td>
                <td>${entry.month}</td>
                <td>${entry.formattedDate}</td>
                <td>${entry.auditorName}</td>
                <td>${entry.omName}</td>
                <td>${entry.site}</td>
                <td>${entry.tlName}</td>
                <td>${entry.agentName}</td>
                <td>${entry.cleanAccount}</td>
                <td>${entry.reasonCode}</td>
                <td>${entry.noc}</td>
                <td class="remarks-col">${entry.remarks}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    function copyToClipboard() {
        if (entryList.length === 0) {
            alert("No entries to copy!");
            return;
        }

        const tempDiv = document.createElement("div");
        tempDiv.style.all = "initial"; 
        tempDiv.style.position = "absolute";
        tempDiv.style.left = "-9999px";
        
        // Transparent and Black text !important for Google Sheets pasting
        let tableHTML = "<table style='background-color: transparent !important; color: #000000 !important; font-family: Arial, sans-serif; font-size: 10pt; border-collapse: collapse;'><tbody>";
        
        entryList.forEach(entry => {
            tableHTML += `
                <tr>
                    <td style="text-align: center; background-color: transparent !important; color: #000000 !important;">${entry.year}</td>
                    <td style="text-align: center; background-color: transparent !important; color: #000000 !important;">${entry.month}</td>
                    <td style="text-align: center; background-color: transparent !important; color: #000000 !important;">${entry.formattedDate}</td>
                    <td style="text-align: center; background-color: transparent !important; color: #000000 !important;">${entry.auditorName}</td>
                    <td style="text-align: center; background-color: transparent !important; color: #000000 !important;">${entry.omName}</td>
                    <td style="text-align: center; background-color: transparent !important; color: #000000 !important;">${entry.site}</td>
                    <td style="text-align: center; background-color: transparent !important; color: #000000 !important;">${entry.tlName}</td>
                    <td style="text-align: center; background-color: transparent !important; color: #000000 !important;">${entry.agentName}</td>
                    <td style="text-align: center; background-color: transparent !important; color: #000000 !important;">${entry.cleanAccount}</td>
                    <td style="text-align: center; background-color: transparent !important; color: #000000 !important;">${entry.reasonCode}</td>
                    <td style="text-align: center; background-color: transparent !important; color: #000000 !important;">${entry.noc}</td>
                    <td style="text-align: left; background-color: transparent !important; color: #000000 !important;">${entry.remarks}</td>
                </tr>
            `;
        });
        
        tableHTML += "</tbody></table>";
        tempDiv.innerHTML = tableHTML;
        document.body.appendChild(tempDiv);

        const range = document.createRange();
        range.selectNodeContents(tempDiv);
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);

        try {
            document.execCommand('copy');
            alert("Copied successfully! You can now paste into Google Sheets (formatting is transparent).");
        } catch (err) {
            alert("Failed to copy data.");
        }

        selection.removeAllRanges();
        document.body.removeChild(tempDiv);
    }

    function clearOutput() {
        if(confirm("Are you sure you want to clear all data?")) {
            entryList = [];
            editingIndex = -1;
            document.getElementById("addUpdateBtn").innerHTML = "➕ Add Entry to List";
            renderTable();
        }
    }

    function clearForm() {
        document.getElementById("auditDate").value = "";
        document.getElementById("tlName").value = "";
        document.getElementById("agentName").value = "";
        document.getElementById("omName").value = "";
        document.getElementById("account").value = "";
        document.getElementById("remarks").value = "";
        document.getElementById("noc").value = "Yes";
        
        editingIndex = -1;
        document.getElementById("addUpdateBtn").innerHTML = "➕ Add Entry to List";
    }
</script>
