<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CCTV Audit</title>
    
    <!-- Import Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Light Mode (Default) - Soft Gray & Clean White */
            --bg-color: #e5e7eb; /* Soft light gray, easy on the eyes */
            --container-bg: #ffffff; /* Pure white form */
            --text-color: #1f2937; /* Dark gray/black for reading */
            --label-color: #003399; /* Navy Blue for labels */
            --input-bg: #ffffff; /* White inside text boxes */
            --input-border: #d1d5db; /* Light gray border for text boxes */
            
            --primary-color: #278914; /* Brand Green */
            --primary-hover: #207110; 
            --secondary-color: #003399; /* Brand Navy Blue */
            --border-color: #e5e7eb; /* Light border line */
            
            --danger-bg: #ef4444;
            --success-bg: #10b981;
            --warning-bg: #f59e0b;
            
            /* Table Variables */
            --table-even: #f9fafb;
            --table-hover: #f3f4f6;
            --table-header-bg: var(--secondary-color);
            --table-header-text: #ffffff;
        }

        /* Dark Mode Theme */
        body.dark-mode {
            --bg-color: #121212; 
            --container-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --label-color: #60a5fa; /* Lighter blue for dark mode visibility */
            --input-bg: #2d2d2d;
            --input-border: #404040;
            --border-color: #404040;
            
            --table-even: #252525;
            --table-hover: #333333;
            --table-header-bg: #0a0a0a;
            --table-header-text: var(--primary-color);
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            max-width: 1000px; 
            margin: 0 auto; 
            padding: 20px 10px; 
            overflow-x: hidden;
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Theme Toggle Button */
        #themeToggle {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background-color: var(--container-bg);
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1000;
            transition: all 0.3s ease;
            flex: none; /* Prevents global button flex rule */
            padding: 0;
            color: var(--text-color);
        }
        #themeToggle:hover {
            transform: scale(1.1);
        }

        .container { 
            background: var(--container-bg); 
            padding: 30px; 
            border-radius: 12px; 
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05); /* Clean, soft shadow */
            margin-bottom: 30px;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        h2 { 
            margin-top: 0; 
            color: var(--secondary-color); /* Navy Blue */
            border-bottom: 3px solid var(--primary-color); /* Green line under title */
            padding-bottom: 12px; 
            font-weight: 700;
            letter-spacing: -0.5px;
            text-transform: uppercase;
        }

        body.dark-mode h2 {
            color: #ffffff;
        }

        /* Desktop: Asymmetric Grid Layout */
        .form-grid {
            display: grid;
            grid-template-columns: 1.5fr 1fr 1.5fr; 
            gap: 16px;
        }
        
        .field-date { grid-column: 1 / 2; }
        .field-site { grid-column: 2 / 4; }
        .field-tl { grid-column: 1 / 3; }
        .field-agent { grid-column: 3 / 4; }
        .field-om { grid-column: 1 / 2; }
        .field-account { grid-column: 2 / 4; }
        .field-reason { grid-column: 1 / 3; }
        .field-noc { grid-column: 3 / 4; }
        .field-remarks { grid-column: 1 / -1; } 
        
        label { 
            display: block; 
            font-weight: 600; 
            margin-bottom: 6px; 
            font-size: 13px; 
            color: var(--label-color);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: color 0.3s ease;
        }
        
        .input-group {
            display: flex;
            gap: 8px;
        }
        
        input[type="text"], input[type="date"], select { 
            width: 100%; 
            padding: 12px; 
            background-color: var(--input-bg);
            color: var(--text-color);
            border: 1px solid var(--input-border); 
            border-radius: 6px; /* Slightly rounded */
            box-sizing: border-box; 
            font-family: inherit;
            font-size: 14px;
            transition: all 0.2s ease;
        }
        
        input::placeholder {
            color: #9ca3af;
        }
        
        /* LINYA LANG MAG GREEN KAPAG CLINICK, BACKGROUND REMAINS */
        input:focus, select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(39, 137, 20, 0.15); /* Soft green glow outside */
            background-color: var(--input-bg);
        }
        
        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }
        
        /* Form Buttons Scope */
        .form-grid button, .button-group button, .action-btns button {
            cursor: pointer; 
            transition: all 0.2s ease;
        }

        .button-group > button { 
            background-color: var(--primary-color); 
            color: #ffffff; 
            border: none; 
            padding: 12px 20px; 
            font-size: 14px; 
            border-radius: 6px; 
            font-weight: 600; 
            flex: 1;
            letter-spacing: 0.5px;
        }
        .button-group > button:hover { 
            background-color: var(--primary-hover); 
        }
        
        button.add-btn, button.remove-btn {
            flex: 0 0 42px;
            padding: 0;
            font-size: 20px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        button.add-btn { background-color: var(--secondary-color); color: #ffffff; border: none; }
        button.add-btn:hover { background-color: #002266; }
        
        button.remove-btn { background-color: #fee2e2; color: var(--danger-bg); border: 1px solid #fca5a5; }
        button.remove-btn:hover { background-color: var(--danger-bg); color: #ffffff; border-color: var(--danger-bg); }
        
        button.clear-btn { background-color: transparent !important; border: 1px solid var(--danger-bg) !important; color: var(--danger-bg) !important; }
        button.clear-btn:hover { background-color: var(--danger-bg) !important; color: #fff !important; }
        
        button.copy-btn { background-color: var(--secondary-color) !important; border: none !important; color: #ffffff !important;}
        button.copy-btn:hover { background-color: #002266 !important; }
        
        .action-btns {
            display: flex;
            gap: 5px;
            justify-content: center;
        }
        button.edit-btn, button.delete-btn {
            padding: 6px 10px; font-size: 12px; flex: none; width: auto; border-radius: 4px; border: none; color: #ffffff;
        }
        button.edit-btn { background-color: var(--warning-bg); color: #000; }
        button.edit-btn:hover { background-color: #d97706; color: #fff; }
        button.delete-btn { background-color: var(--danger-bg); }
        button.delete-btn:hover { background-color: #b91c1c; }

        .output-section { margin-top: 40px; }
        .output-section label { color: var(--secondary-color); border-bottom: 1px solid var(--border-color); padding-bottom: 8px; margin-bottom: 15px; display: block; }
        
        body.dark-mode .output-section label { color: var(--label-color); }

        .table-container {
            width: 100%;
            max-height: 350px;
            overflow-y: auto;
            overflow-x: auto;
            background-color: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 15px;
            -webkit-overflow-scrolling: touch; 
            transition: background-color 0.3s ease;
        }
        
        .table-container::-webkit-scrollbar { width: 8px; height: 8px; }
        .table-container::-webkit-scrollbar-track { background: var(--bg-color); }
        .table-container::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
        .table-container::-webkit-scrollbar-thumb:hover { background: #9ca3af; }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-color);
            text-align: center; 
            white-space: nowrap;
        }
        th {
            background-color: var(--table-header-bg);
            color: var(--table-header-text);
            position: sticky;
            top: 0;
            z-index: 1;
            font-weight: 600;
            transition: background-color 0.3s ease;
        }
        /* Alternating row colors for clean look */
        tbody tr:nth-child(even) {
            background-color: var(--table-even);
        }
        tbody tr:hover {
            background-color: var(--table-hover);
        }
        td.remarks-col {
            text-align: left;
            white-space: normal;
            min-width: 250px; 
        }

        /* --- RESPONSIVE MEDIA QUERIES --- */
        @media screen and (max-width: 900px) {
            .form-grid { grid-template-columns: 1fr 1fr; }
            .field-date, .field-site, .field-tl, .field-agent, .field-om, .field-account, .field-reason, .field-noc {
                grid-column: span 1; 
            }
            .field-remarks { grid-column: 1 / -1; } 
        }

        @media screen and (max-width: 600px) {
            body { padding: 10px; margin: 10px auto; }
            .container { padding: 20px; }
            .form-grid { grid-template-columns: 1fr; gap: 12px; }
            .field-date, .field-site, .field-tl, .field-agent, .field-om, .field-account, .field-reason, .field-noc, .field-remarks {
                grid-column: 1 / -1; 
            }
            .button-group { flex-direction: column; }
            .button-group button { width: 100%; padding: 15px; }
            .button-group button.clear-btn { margin-top: 5px; }
            #themeToggle { top: 10px; right: 10px; width: 40px; height: 40px; font-size: 18px; }
        }
    </style>
</head>
<body>

<!-- Floating Theme Toggle Button -->
<button id="themeToggle" onclick="toggleTheme()" title="Toggle Dark/Light Mode">🌙</button>

<div class="container">
    <h2>CCTV Audit</h2>
    
    <div class="form-grid">
        <div class="form-group field-date">
            <label for="auditDate">Date of Audit</label>
            <input type="date" id="auditDate" required>
        </div>

        <div class="form-group field-site">
            <label for="site">Site</label>
            <div class="input-group">
                <select id="site">
                    <!-- Populated by JS LocalStorage -->
                </select>
                <button type="button" class="add-btn" onclick="addNewOption('site', 'New Site Name')" title="Add New Site">+</button>
                <button type="button" class="remove-btn" onclick="removeSelectedOption('site')" title="Delete Selected Site">-</button>
            </div>
        </div>

        <div class="form-group field-tl">
            <label for="tlName">TL Name</label>
            <input type="text" id="tlName" placeholder="Enter TL Name">
        </div>

        <div class="form-group field-agent">
            <label for="agentName">Agent Name</label>
            <input type="text" id="agentName" placeholder="Enter Agent Name">
        </div>

        <div class="form-group field-om">
            <label for="omName">OM Name</label>
            <div class="input-group">
                <select id="omName">
                    <!-- Populated by JS LocalStorage -->
                </select>
                <button type="button" class="add-btn" onclick="addNewOption('omName', 'New OM Name')" title="Add New OM">+</button>
                <button type="button" class="remove-btn" onclick="removeSelectedOption('omName')" title="Delete Selected OM">-</button>
            </div>
        </div>

        <div class="form-group field-account">
            <label for="account">Account / Campaign</label>
            <div class="input-group">
                <select id="account">
                    <!-- Populated by JS LocalStorage -->
                </select>
                <button type="button" class="add-btn" onclick="addNewOption('account', 'New Account/Campaign')" title="Add New Account">+</button>
                <button type="button" class="remove-btn" onclick="removeSelectedOption('account')" title="Delete Selected Account">-</button>
            </div>
        </div>

        <div class="form-group field-reason">
            <label for="reasonCode">CCTV Reason Code</label>
            <div class="input-group">
                <select id="reasonCode">
                    <!-- Populated by JS LocalStorage -->
                </select>
                <button type="button" class="add-btn" onclick="addNewOption('reasonCode', 'New Reason Code')" title="Add New Reason Code">+</button>
                <button type="button" class="remove-btn" onclick="removeSelectedOption('reasonCode')" title="Delete Selected Reason Code">-</button>
            </div>
        </div>

        <div class="form-group field-noc">
            <label for="noc">NOC (Status)</label>
            <select id="noc">
                <option value="Yes">Yes</option>
                <option value="No">No</option>
                <option value="Pending">Pending</option>
                <option value="Disputed">Disputed</option>
            </select>
        </div>

        <div class="form-group field-remarks">
            <label for="remarks">Remarks</label>
            <input type="text" id="remarks" placeholder="Brief summary of the incident">
        </div>
    </div>

    <div class="button-group">
        <button id="addUpdateBtn" onclick="submitEntry()">➕ Add Entry to List</button>
        <button onclick="clearForm()" class="clear-btn">Clear Form</button>
    </div>

    <div class="output-section">
        <label>Data Output Grid</label>
        
        <div class="table-container">
            <table id="outputTable">
                <thead>
                    <tr>
                        <th>Actions</th>
                        <th>Year</th>
                        <th>Month</th>
                        <th>Date</th>
                        <th>Name</th>
                        <th>OM</th>
                        <th>SITE</th>
                        <th>TL Name</th>
                        <th>Agent Name</th>
                        <th>Account</th>
                        <th>CCTV Reason</th>
                        <th>NOC</th>
                        <th>Remarks</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Entries will populate here -->
                </tbody>
            </table>
        </div>
        
        <div class="button-group">
            <button class="copy-btn" onclick="copyToClipboard()">📋 Copy to Clipboard</button>
            <button class="clear-btn" onclick="clearOutput()">🗑️ Clear All</button>
        </div>
    </div>
</div>

<script>
    // --- DARK / LIGHT MODE TOGGLE LOGIC ---

        document.getElementById('themeToggle').textContent = isDark ? '☀️' : '🌙';
    }

    // Initialize Theme on Load
    const savedTheme = localStorage.getItem('cctv_theme');
    if (savedTheme === 'dark') {
        document.body.classList.add('dark-mode');
        document.getElementById('themeToggle').textContent = '☀️';
    } else {
        document.getElementById('themeToggle').textContent = '🌙';

    const rawOmData = `Abby\nBIGO - Thirdy\nCFC\nCherry\nCrystal\nDerline\nFreda\nIrene\nMarc Jardenico\nMcJordan\nMichelle\nMirah\nMogan\nNorman\nRenato\nRhelford\nRuth\nShayne\nSheila\nShey\nSP - James\nSP - Marc\nSP - MJ\nWilly`;

    function processRaw(rawStr) {
        const arr = rawStr.split('\n').map(s => s.trim()).filter(s => s !== "");
        return [...new Set(arr)].sort((a, b) => a.toLowerCase().localeCompare(b.toLowerCase()));
    }

    const defaultData = {
        site: ["Mabini Site A", "Mabini Site B"],
        omName: processRaw(rawOmData),
        account: processRaw(rawCampaignData),
        reasonCode: ["SLEEPING", "DRESS CODE", "BROWSING", "WASTING TIME", "BRINGING NON-WOF", "EATING", "IMPROPER HOUSE KEEPING", "EQUIPMENT TAMPERING", "PDA", "DISORDERLY CONDUCT", "USING SMARTPHONE", "THEFT", "SELLING"]
    };

    const labelMap = {
        site: "Site",
        omName: "OM Name",
        account: "Account/Campaign",
        reasonCode: "Reason Code"
    };

    let currentDropdownData = {};
    let entryList = [];
    let editingIndex = -1; 

    window.onload = function() {
        initDropdown("site");
        initDropdown("omName");
        initDropdown("account");
        initDropdown("reasonCode");

        const storedEntries = localStorage.getItem('cctv_entry_list');
        if (storedEntries) {
            try { entryList = JSON.parse(storedEntries); } 
            catch (e) { entryList = []; }
        }
        renderTable();
    };

    function initDropdown(selectId) {
        const storageKey = `cctv_dropdown_${selectId}`;
        const stored = localStorage.getItem(storageKey);
        
        try {
            if (stored) {
                currentDropdownData[selectId] = JSON.parse(stored);
            } else {
                currentDropdownData[selectId] = [...defaultData[selectId]];
                localStorage.setItem(storageKey, JSON.stringify(currentDropdownData[selectId]));
            }
        } catch(e) {
            currentDropdownData[selectId] = [...defaultData[selectId]];
        }
        renderDropdownOptions(selectId);
    }

    function renderDropdownOptions(selectId) {
        const select = document.getElementById(selectId);
        const currentVal = select.value; 
        
        select.innerHTML = `<option value="">-- Select ${labelMap[selectId]} --</option>`;
        
        currentDropdownData[selectId]
            .sort((a, b) => a.toLowerCase().localeCompare(b.toLowerCase()))
            .forEach(item => {
                const option = document.createElement("option");
                option.value = item;
                option.textContent = item;
                select.appendChild(option);
            });
            
        if(currentVal && currentDropdownData[selectId].includes(currentVal)) {
            select.value = currentVal;
        }
    }

    function addNewOption(selectId, promptText) {
        const newValue = prompt(`Enter ${promptText}:`);
        
        if (newValue && newValue.trim() !== "") {
            const cleanValue = newValue.trim();
            
            if (!currentDropdownData[selectId].includes(cleanValue)) {
                currentDropdownData[selectId].push(cleanValue);
                localStorage.setItem(`cctv_dropdown_${selectId}`, JSON.stringify(currentDropdownData[selectId]));
                renderDropdownOptions(selectId);
            } else {
                alert("This option already exists!");
            }
            document.getElementById(selectId).value = cleanValue;
        }
    }

    function removeSelectedOption(selectId) {
        const select = document.getElementById(selectId);
        const selectedIndex = select.selectedIndex;
        
        if (selectedIndex <= 0) {
            alert("You cannot remove the default placeholder.");
            return;
        }
        
        const selectedOption = select.options[selectedIndex];
        if (confirm(`Are you sure you want to delete "${selectedOption.text}"? It will be removed permanently.`)) {
            const valueToRemove = selectedOption.value;
            currentDropdownData[selectId] = currentDropdownData[selectId].filter(item => item !== valueToRemove);
            localStorage.setItem(`cctv_dropdown_${selectId}`, JSON.stringify(currentDropdownData[selectId]));
            renderDropdownOptions(selectId);
        }
    }

    function saveEntries() {
        localStorage.setItem('cctv_entry_list', JSON.stringify(entryList));
    }

    function submitEntry() {
        const dateInput = document.getElementById("auditDate").value;
        if (!dateInput) { alert("Please select a date."); return; }

        const dateObj = new Date(dateInput);
        const year = dateObj.getFullYear();
        const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        const month = months[dateObj.getMonth()];
        const formattedDate = `${dateObj.getMonth() + 1}/${dateObj.getDate()}/${year}`;

        const auditorName = "Miles"; 
        const site = document.getElementById("site").value;
        const tlName = document.getElementById("tlName").value || "N/A";
        const agentName = document.getElementById("agentName").value || "N/A";
        const omSelection = document.getElementById("omName").value;
        const accountSelection = document.getElementById("account").value;
        const reasonCode = document.getElementById("reasonCode").value;
        const noc = document.getElementById("noc").value;
        const remarks = document.getElementById("remarks").value || "N/A";

        if (!omSelection) { alert("Please select an OM."); return; }
        if (!accountSelection) { alert("Please select an Account."); return; }

        const entry = {
            rawDate: dateInput, 
            year, month, formattedDate, auditorName, 
            omName: omSelection, 
            site, tlName, agentName, 
            cleanAccount: accountSelection, 
            reasonCode, noc, remarks
        };
        
        if (editingIndex === -1) {
            entryList.push(entry);
        } else {
            entryList[editingIndex] = entry;
            editingIndex = -1;
            document.getElementById("addUpdateBtn").innerHTML = "➕ Add Entry to List";
        }
        
        saveEntries();
        renderTable();
    }

    function editEntry(index) {
        const entry = entryList[index];
        document.getElementById("auditDate").value = entry.rawDate;
        document.getElementById("site").value = entry.site;
        document.getElementById("tlName").value = entry.tlName;
        document.getElementById("agentName").value = entry.agentName;
        document.getElementById("omName").value = entry.omName;
        document.getElementById("account").value = entry.cleanAccount;
        document.getElementById("reasonCode").value = entry.reasonCode;
        document.getElementById("noc").value = entry.noc;
        document.getElementById("remarks").value = entry.remarks;

        editingIndex = index;
        document.getElementById("addUpdateBtn").innerHTML = "💾 Update Entry";
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteEntry(index) {
        if (editingIndex === index) {
            clearForm();
        } else if (editingIndex > index) {
            editingIndex--;
        }
        entryList.splice(index, 1);
        saveEntries();
        renderTable();
    }

    function renderTable() {
        const tbody = document.querySelector("#outputTable tbody");
        tbody.innerHTML = "";
        
        entryList.forEach((entry, index) => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>
                    <div class="action-btns">
                        <button class="edit-btn" onclick="editEntry(${index})" title="Edit Row">✏️</button>
                        <button class="delete-btn" onclick="deleteEntry(${index})" title="Remove Row">❌</button>
                    </div>
                </td>
                <td>${entry.year}</td>
                <td>${entry.month}</td>
                <td>${entry.formattedDate}</td>
                <td>${entry.auditorName}</td>
                <td>${entry.omName}</td>
                <td>${entry.site}</td>
                <td>${entry.tlName}</td>
                <td>${entry.agentName}</td>
                <td>${entry.cleanAccount}</td>
                <td>${entry.reasonCode}</td>
                <td>${entry.noc}</td>
                <td class="remarks-col">${entry.remarks}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    function copyToClipboard() {
        if (entryList.length === 0) {
            alert("No entries to copy!");
            return;
        }

        const tempDiv = document.createElement("div");
        tempDiv.style.all = "initial"; 
        tempDiv.style.position = "absolute";
        tempDiv.style.left = "-9999px";
        
        // NO BORDERS, TRANSPARENT BACKGROUND, BLACK TEXT
        let tableHTML = "<table style='border-collapse: collapse; border: none; background-color: transparent !important; color: #000000 !important; font-family: Arial, sans-serif; font-size: 10pt;'><tbody>";
        
        entryList.forEach(entry => {
            tableHTML += `
                <tr>
                    <td style="border: none; text-align: center; background-color: transparent !important; color: #000000 !important;">${entry.year}</td>
                    <td style="border: none; text-align: center; background-color: transparent !important; color: #000000 !important;">${entry.month}</td>
                    <td style="border: none; text-align: center; background-color: transparent !important; color: #000000 !important;">${entry.formattedDate}</td>
                    <td style="border: none; text-align: center; background-color: transparent !important; color: #000000 !important;">${entry.auditorName}</td>
                    <td style="border: none; text-align: center; background-color: transparent !important; color: #000000 !important;">${entry.omName}</td>
                    <td style="border: none; text-align: center; background-color: transparent !important; color: #000000 !important;">${entry.site}</td>
                    <td style="border: none; text-align: center; background-color: transparent !important; color: #000000 !important;">${entry.tlName}</td>
                    <td style="border: none; text-align: center; background-color: transparent !important; color: #000000 !important;">${entry.agentName}</td>
                    <td style="border: none; text-align: center; background-color: transparent !important; color: #000000 !important;">${entry.cleanAccount}</td>
                    <td style="border: none; text-align: center; background-color: transparent !important; color: #000000 !important;">${entry.reasonCode}</td>
                    <td style="border: none; text-align: center; background-color: transparent !important; color: #000000 !important;">${entry.noc}</td>
                    <td style="border: none; text-align: left; background-color: transparent !important; color: #000000 !important;">${entry.remarks}</td>
                </tr>
            `;
        });
        
        tableHTML += "</tbody></table>";
        tempDiv.innerHTML = tableHTML;
        document.body.appendChild(tempDiv);

        const range = document.createRange();
        range.selectNodeContents(tempDiv);
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);

        try {
            document.execCommand('copy');
            alert("Copied successfully! Ready to paste to Google Sheets.");
        } catch (err) {
            alert("Failed to copy data.");
        }

        selection.removeAllRanges();
        document.body.removeChild(tempDiv);
    }

    function clearOutput() {
        if(confirm("Are you sure you want to clear all data?")) {
            entryList = [];
            editingIndex = -1;
            document.getElementById("addUpdateBtn").innerHTML = "➕ Add Entry to List";
            saveEntries(); 
            renderTable();
        }
    }

    function clearForm() {
        document.getElementById("auditDate").value = "";
        document.getElementById("tlName").value = "";
        document.getElementById("agentName").value = "";
        document.getElementById("omName").value = "";
        document.getElementById("account").value = "";
        document.getElementById("remarks").value = "";
        document.getElementById("noc").value = "Yes";
        
        editingIndex = -1;
        document.getElementById("addUpdateBtn").innerHTML = "➕ Add Entry to List";
    }
</script>

</body>
</html>
